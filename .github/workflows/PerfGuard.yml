name: PerfGuard

# 静态策略由 Android Lint 解析源码与符号；运行时降级策略在各自模块做行为验证。
# 不用源码调用次数冒充帧耗时，也不依赖 FCM 等 secret。
# 设备侧帧耗时仍由真机采集脚本测量，不把 hosted runner 抖动当 PR 性能门禁。

on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: perfguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-guards:
    name: 语义策略与运行时守卫
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run semantic policies and behavior checks
        env:
          # GitHub Packages requires authentication even for public packages.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci_quality.sh

      - name: 上传验证报告
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: perfguard-diagnostics
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest
            design-system/build/reports/tests/testDebugUnitTest
            ci-lint/build/reports/tests/test
          retention-days: 7
